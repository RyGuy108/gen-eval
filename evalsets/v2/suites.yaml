# gen-eval eval set v2
#
# Same prompts and references as v1 (so v1 renders are reused, no new credits); adds verifiable
# `checks` to every adherence item because contrastive CLIP failed calibration on v1.
#
# Frozen once published: the loader hashes every item and reference image and refuses to run if
# the hash no longer matches MANIFEST.json. To change anything, copy to evalsets/v2 and bump.
#
# Every item names the scorers that apply to it. Foils are the prompt with exactly one fact
# broken; the contrastive CLIP test asks whether the output matches the prompt better than all of
# them. Character items always carry a "plain studio headshot" foil so a model that just returns
# the reference photo cannot score well.

version: v2
defaults:
  aspect_ratio: "1:1"

suites:
  text:
    task: image
    endpoint: generate
    description: Exact text rendered in-scene (signs, posters, labels, thumbnails).
    items:
      - id: t01
        prompt: 'A photo of a small corner coffee shop with a painted wooden sign above the door that reads "MORNING BREW CAFE"'
        text: ["MORNING BREW CAFE"]
      - id: t02
        prompt: 'A movie poster for a thriller with the title "THE LAST LIGHTHOUSE" in large letters and the line "IN THEATERS JUNE 12" at the bottom'
        text: ["THE LAST LIGHTHOUSE", "IN THEATERS JUNE 12"]
      - id: t03
        prompt: 'Product photo of a white ceramic coffee mug printed with the words "WORLD''S OKAYEST DEVELOPER" in black serif type'
        text: ["WORLD'S OKAYEST DEVELOPER"]
      - id: t04
        prompt: 'A close-up photo of a printed restaurant receipt on a wooden table with three lines: "2 TACOS 8.50", "1 HORCHATA 3.25" and "TOTAL 11.75"'
        text: ["2 TACOS 8.50", "1 HORCHATA 3.25", "TOTAL 11.75"]
      - id: t05
        prompt: 'A YouTube thumbnail of a surprised young man pointing at bold yellow text that says "I TRIED 7 AI MODELS"'
        text: ["I TRIED 7 AI MODELS"]
      - id: t06
        prompt: 'A glass jar of honey on a kitchen counter with a kraft paper label reading "WILDFLOWER HONEY" and below it "NET WT 12 OZ"'
        text: ["WILDFLOWER HONEY", "NET WT 12 OZ"]
      - id: t07
        prompt: 'A cafe chalkboard menu with three lines written in white chalk: "LATTE 4.50", "MOCHA 5.25", "CHAI 4.75"'
        text: ["LATTE 4.50", "MOCHA 5.25", "CHAI 4.75"]
      - id: t08
        prompt: 'A hardcover book cover for a novel titled "THE QUIET ALGORITHM" with the author name "ELENA VASQUEZ-MORROW" printed below the title'
        text: ["THE QUIET ALGORITHM", "ELENA VASQUEZ-MORROW"]

  adherence:
    task: image
    endpoint: generate
    description: Counting, attribute binding, spatial relations, style and composition.
    items:
      - id: a01
        prompt: three red apples and one green pear on a wooden table
        foils:
          - two red apples and one green pear on a wooden table
          - three green apples and one red pear on a wooden table
          - three red apples and one green pear on a marble counter
        checks:
          - {check: count, object: apple, color: red, n: 3}
          - {check: count, object: pear, n: 1}
      - id: a02
        prompt: a red cube to the left of a blue sphere on a white floor
        foils:
          - a blue cube to the left of a red sphere on a white floor
          - a red sphere to the left of a blue cube on a white floor
          - a red cube and a blue cube on a white floor
        checks:
          - {check: color, object: cube, color: red}
          - {check: color, object: sphere, color: blue}
          - {check: position, a: cube, rel: left_of, b: sphere}
      - id: a03
        prompt: a cat wearing a yellow raincoat sitting on top of a stack of books
        foils:
          - a dog wearing a yellow raincoat sitting on top of a stack of books
          - a cat wearing a red raincoat sitting on top of a stack of books
          - a cat wearing a yellow raincoat sitting next to a stack of books
        checks:
          - {check: count, object: cat, n: 1}
          - {check: color, object: raincoat, color: yellow}
          - {check: on_top_of, a: cat, b: stack of books}
      - id: a04
        prompt: a small blue bird sitting on the head of a large brown bear
        foils:
          - a small brown bird sitting on the head of a large blue bear
          - a small blue bird flying next to a large brown bear
          - a small blue bird sitting on the head of a large brown moose
        checks:
          - {check: color, object: bird, color: blue}
          - {check: color, object: bear, color: brown}
          - {check: on_top_of, a: bird, b: bear}
      - id: a05
        prompt: five hot air balloons floating over a desert canyon
        foils:
          - one hot air balloon floating over a desert canyon
          - five hot air balloons floating over a snowy mountain range
          - five kites floating over a desert canyon
        checks:
          - {check: count, object: hot air balloon, n: 5}
      - id: a06
        prompt: a giraffe and a zebra standing side by side, the giraffe is wearing a red scarf
        foils:
          - a giraffe and a zebra standing side by side, the zebra is wearing a red scarf
          - a giraffe and a zebra standing side by side, the giraffe is wearing a blue scarf
          - two giraffes standing side by side, one is wearing a red scarf
        checks:
          - {check: count, object: giraffe, n: 1}
          - {check: count, object: zebra, n: 1}
          - {check: color, object: scarf, color: red}
          - {check: wears, a: giraffe, item: scarf, among: [giraffe, zebra]}
      - id: a07
        prompt: a glass of orange juice next to an open laptop showing a spreadsheet
        foils:
          - a glass of milk next to an open laptop showing a spreadsheet
          - a cup of coffee next to an open laptop showing a spreadsheet
          - a glass of orange juice next to a closed laptop
        checks:
          - {check: color, object: glass of juice, color: [orange, yellow]}
          - {check: count, object: laptop, n: 1}
      - id: a08
        prompt: a watercolor painting of a fox sleeping under a pine tree in the snow
        foils:
          - an oil painting of a fox sleeping under a pine tree in the snow
          - a watercolor painting of a fox running under a pine tree in the snow
          - a watercolor painting of a wolf sleeping under a pine tree in the snow
        checks:
          - {check: count, object: fox, n: 1}
          - {check: style, style: watercolor painting, vs: [photograph, oil painting, 3d render]}

      # a09-a14 were added in v2 and written before any of their renders existed: they are the
      # held-out items for validating the detector checks, which were developed on a01-a08.
      - id: a09
        prompt: two red umbrellas and one yellow umbrella on a sandy beach
        foils:
          - one red umbrella and two yellow umbrellas on a sandy beach
          - two red umbrellas and one yellow umbrella on a snowy field
          - three red umbrellas on a sandy beach
        checks:
          - {check: count, object: umbrella, color: red, n: 2}
          - {check: count, object: umbrella, color: yellow, n: 1}
      - id: a10
        prompt: a white dog sitting to the right of a black cat on a green sofa
        foils:
          - a black dog sitting to the right of a white cat on a green sofa
          - a white dog sitting to the right of a black cat on a red sofa
          - a white dog sitting to the right of a black rabbit on a green sofa
        checks:
          - {check: color, object: dog, color: white}
          - {check: color, object: cat, color: black}
          - {check: position, a: cat, rel: left_of, b: dog}
          - {check: color, object: sofa, color: green}
      - id: a11
        prompt: four oranges in a blue bowl on a kitchen table
        foils:
          - three oranges in a blue bowl on a kitchen table
          - four oranges in a red bowl on a kitchen table
          - four lemons in a blue bowl on a kitchen table
        checks:
          - {check: count, object: orange, n: 4}
          - {check: color, object: bowl, color: blue}
      - id: a12
        prompt: a yellow taxi parked next to a red fire hydrant on a city street
        foils:
          - a red taxi parked next to a yellow fire hydrant on a city street
          - a yellow taxi parked next to a blue mailbox on a city street
          - a yellow school bus parked next to a red fire hydrant on a city street
        checks:
          - {check: color, object: taxi, color: yellow}
          - {check: color, object: fire hydrant, color: red}
      - id: a13
        prompt: a teddy bear sitting on top of a wooden chair in an empty room
        foils:
          - a teddy bear sitting under a wooden chair in an empty room
          - a cat sitting on top of a wooden chair in an empty room
          - a teddy bear sitting on top of a wooden table in an empty room
        checks:
          - {check: count, object: teddy bear, n: 1}
          - {check: on_top_of, a: teddy bear, b: chair}
      - id: a14
        prompt: a purple backpack hanging on a white door
        foils:
          - a white backpack hanging on a purple door
          - a purple backpack hanging on a wooden door
          - a purple suitcase standing next to a white door
        checks:
          - {check: color, object: backpack, color: purple}
          - {check: color, object: door, color: white}

  character:
    task: image
    endpoint: edit
    description: Keep a reference person's identity in a new scene (reference image -> edit model).
    items:
      - id: c01
        ref: maya
        prompt: The same woman from the reference photo hiking on a mountain trail at golden hour, wearing a red jacket, three-quarter view, photorealistic
        scene: a woman hiking on a mountain trail at golden hour wearing a red jacket
        foils:
          - a studio headshot of a woman on a plain grey background
          - a woman sitting in a coffee shop wearing a red jacket
      - id: c02
        ref: maya
        prompt: The same woman from the reference photo working on a laptop in a busy coffee shop, smiling, natural window light, photorealistic
        scene: a smiling woman working on a laptop in a busy coffee shop
        foils:
          - a studio headshot of a woman on a plain grey background
          - a woman reading a book on a park bench
      - id: c03
        ref: dele
        prompt: The same man from the reference photo giving a talk on a conference stage in front of a large screen, wearing a navy suit, medium shot, photorealistic
        scene: a man in a navy suit giving a talk on a conference stage in front of a large screen
        foils:
          - a studio headshot of a man on a plain grey background
          - a man in a navy suit sitting at an office desk
      - id: c04
        ref: dele
        prompt: The same man from the reference photo cooking in a home kitchen, wearing an apron, laughing, photorealistic
        scene: a laughing man cooking in a home kitchen wearing an apron
        foils:
          - a studio headshot of a man on a plain grey background
          - a man washing a car in a driveway
      - id: c05
        ref: ingrid
        prompt: The same woman from the reference photo kneeling in a vegetable garden among tomato plants, wearing a straw hat, sunny day, photorealistic
        scene: an older woman in a straw hat kneeling in a vegetable garden among tomato plants
        foils:
          - a studio headshot of an older woman on a plain grey background
          - an older woman in a straw hat walking on a beach
      - id: c06
        ref: tomas
        prompt: The same man from the reference photo riding a skateboard in a city plaza, wide shot, photorealistic
        scene: a young man riding a skateboard in a city plaza
        foils:
          - a studio headshot of a young man on a plain grey background
          - a young man riding a bicycle on a country road

      - id: c07
        ref: ingrid
        prompt: The same woman from the reference photo sitting at a dinner table with a young man, both laughing, warm restaurant lighting, photorealistic
        scene: an older woman and a young man laughing together at a dinner table
        foils:
          - a studio headshot of an older woman on a plain grey background
          - an older woman sitting alone at a dinner table

  video:
    task: video
    endpoint: animate
    description: Animate a reference headshot; identity must hold for the whole clip and the action must happen.
    seconds: 5
    adherence_frames: last_third   # the prompted action is an end state, so check where the clip lands
    items:
      - id: v01
        ref: maya
        prompt: She slowly turns her head to the side, then looks back at the camera and breaks into a big warm smile. Static camera, soft studio light.
        scene: a woman with a big smile looking at the camera
        foils:
          - a woman with a serious neutral expression
          - a woman crying
      - id: v02
        ref: dele
        prompt: He lifts a pair of black over-ear headphones onto his head and starts nodding along to music. Static camera, soft studio light.
        scene: a man wearing black over-ear headphones
        foils:
          - a man wearing glasses and no headphones
          - a man talking on a phone
      - id: v03
        ref: ingrid
        prompt: She puts on a pair of dark sunglasses and laughs. Static camera, soft studio light.
        scene: an older woman wearing dark sunglasses and laughing
        foils:
          - an older woman with a neutral expression and no sunglasses
          - an older woman wearing a sun hat
