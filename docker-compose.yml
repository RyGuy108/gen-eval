services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: geneval, POSTGRES_PASSWORD: geneval, POSTGRES_DB: geneval}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "geneval"], interval: 2s, retries: 30}
  redis:
    image: redis:7
  api:
    build: .
    ports: ["8000:8000"]
    environment: {MAGIC_HOUR_API_KEY: "${MAGIC_HOUR_API_KEY}"}
    volumes: [artifacts:/data/artifacts]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    command: sh -c "python -m geneval.cli migrate && uvicorn geneval.api:app --host 0.0.0.0 --port 8000"
  render-worker:
    # renders are I/O bound (submit, poll, download): many concurrent jobs per container
    build: .
    environment: {MAGIC_HOUR_API_KEY: "${MAGIC_HOUR_API_KEY}"}
    volumes: [artifacts:/data/artifacts]
    depends_on: [api]
    deploy: {replicas: 4}
    command: rq worker render --url redis://redis:6379/0
  score-worker:
    # SimpleWorker keeps CLIP / OCR / face models loaded across jobs instead of forking per job
    build: .
    volumes: [artifacts:/data/artifacts]
    depends_on: [api]
    command: rq worker score --url redis://redis:6379/0 --worker-class rq.worker.SimpleWorker
volumes: {pg: {}, artifacts: {}}
